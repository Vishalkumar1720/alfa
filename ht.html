<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Interactive 3D Tilt Card</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
  <style>
    /* Wrapper gives the 3D perspective */
    .card-3d-wrapper {
      perspective: 1000px;
    }

    /* The card itself preserves 3D and transitions */
    .card-3d {
      transform-style: preserve-3d;
      transition: transform 0.1s ease;
      will-change: transform;
    }

    /* Optional styling */
    .card-3d img {
      border-top-left-radius: .5rem;
      border-top-right-radius: .5rem;
    }
  </style>
</head>
<body class="bg-light d-flex justify-content-center align-items-center vh-100">

  <div class="card-3d-wrapper">
    <div class="card card-3d text-white bg-primary" style="width: 18rem;">
      <img src="https://via.placeholder.com/286x180" class="card-img-top" alt="...">
      <div class="card-body">
        <h5 class="card-title">Interactive Tilt Card</h5>
        <p class="card-text">Move your mouse over this card to see it tilt in 3D.</p>
        <a href="#" class="btn btn-light">Learn More</a>
      </div>
    </div>
  </div>

  <script>
    (function() {
      const card = document.querySelector('.card-3d');
      const wrapper = document.querySelector('.card-3d-wrapper');
      const maxTilt = 15; // max degrees of rotation

      wrapper.addEventListener('mousemove', (e) => {
        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const halfWidth = rect.width / 2;
        const halfHeight = rect.height / 2;

        // Calculate rotation ratios (-1 to 1)
        const rotateY = ((x - halfWidth) / halfWidth) * maxTilt;
        const rotateX = -((y - halfHeight) / halfHeight) * maxTilt;

        card.style.transform = `rotateY(${rotateY}deg) rotateX(${rotateX}deg)`;
      });

      wrapper.addEventListener('mouseleave', () => {
        card.style.transition = 'transform 0.5s ease';
        card.style.transform = 'rotateY(0) rotateX(0)';
      });

      wrapper.addEventListener('mouseenter', () => {
        card.style.transition = 'transform 0.1s ease';
      });
    })();
  </script>

</body>
</html>
